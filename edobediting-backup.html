    <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #aad700 0%, black 25%, black 75%, #aad700 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            margin: 0 auto;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 0;
        }
        @media (min-width: 640px)  { .container { padding-left: 12px; padding-right: 12px; } }
        @media (min-width: 768px)  { .container { padding-left: 16px; padding-right: 16px; } }
        @media (min-width: 992px)  { .container { padding-left: 2vw;  padding-right: 2vw;  } }
        @media (min-width: 1600px) { .container { padding-left: 4vw;  padding-right: 4vw;  } }

        .logo-header {
            width: 15%;
            min-width: 140px;
            max-width: 220px;
            padding: 0;
            margin: 1rem 1.5rem 0.6rem auto;
            overflow: hidden;
            display: block;
            border-radius: 0 0 0 12px;
        }
        .logo-header img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            transform: scale(1.5);
            transform-origin: center;
        }

        .hero-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.8rem;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-top: 0.4rem;
        }

        @media (min-width: 992px) {
            .hero-section {
                grid-template-columns: minmax(380px, 1fr) minmax(420px, 1fr);  /* left min smaller, right min bigger */
                gap: clamp(1.5rem, 4vw, 5rem);
                max-width: 1800px;               /* â prevents extreme stretching on 4K+ */
                margin-left: auto;
                margin-right: auto;
            }

            .left-content {
                max-width: 780px;                /* cap text size */
                padding-right: 1rem;
            }

            .right-image {
                max-width: 820px;                /* give image slightly more room */
            }

            .right-image img {
                width: 100%;
                height: auto;
                max-height: 85vh;                /* prevent overly tall image */
                object-fit: cover;
                border-radius: 1.5rem;
                display: block;
            }

            .greeting h1 {
                font-size: clamp(4.2rem, 7vw, 7.2rem);  /* better scaling limit */
                line-height: 1;
            }

            .greeting p:last-child {
                font-size: clamp(1.5rem, 2.4vw, 2.2rem);
            }
        }

        @media (min-width: 1800px) {
            .hero-section {
                max-width: 1900px;
            }
            .left-content  { max-width: 820px; }
            .right-image   { max-width: 880px; }
        }

        .left-content {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            padding: 0.5rem 0;
        }
        .greeting {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .greeting p:first-child {
            font-size: 1.1rem;
            font-weight: 400;
        }
        .greeting h1 {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -0.02em;
            margin: 0;
            white-space: nowrap;
        }
        .greeting p:last-child {
            font-size: 1.15rem;
            font-weight: 500;
        }
        @media (min-width: 640px) {
            .greeting p:first-child { font-size: 1.25rem; }
            .greeting h1 { font-size: 3.2rem; }
            .greeting p:last-child { font-size: 1.3rem; }
        }
        @media (min-width: 768px) {
            .greeting p:first-child { font-size: 1.4rem; }
            .greeting h1 { font-size: 4.1rem; }
            .greeting p:last-child { font-size: 1.6rem; }
        }

        .stats-cards {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1 1 130px;
            max-width: 350px;
            border-radius: 0.9rem;
            padding: 1rem 0.8rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 16px 36px rgba(0,0,0,0.55);
        }
        .stat-card .number {
            font-size: 4.0rem;
            font-weight: 900;
        }
        .stat-card .label {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 0.4rem;
            opacity: 0.92;
        }

        .software-icons {
            display: flex;
            flex-wrap: nowrap;
            justify-content: flex-start;
            overflow-x: auto;
            padding: 0.4rem 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .software-icons::-webkit-scrollbar {
            display: none;
        }
        .icon {
            min-width: 76px;
            width: 8rem;
            height: 4rem;
            border-radius: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
            flex-shrink: 0;
        }
        .icon:hover {
            transform: translateY(-5px);
        }
        .icon img {
            width: 64%;
            height: auto;
        }
        @media (max-width: 500px) {
            .software-icons { gap: 0.5rem; }
            .icon {
                min-width: 68px;
                width: 6.8rem;
                height: 3.6rem;
            }
            .icon img { width: 62%; }
        }

    <script>
        /* =======================
   BLOCK INSPECT ELEMENT
======================= */

// Disable right click
document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
});

// Disable key shortcuts
document.addEventListener('keydown', function (e) {

    // F12
    if (e.keyCode === 123) {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + I / J / C
    if (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) {
        e.preventDefault();
        return false;
    }

    // Ctrl + U
    if (e.ctrlKey && e.key.toUpperCase() === 'U') {
        e.preventDefault();
        return false;
    }
});

// DevTools open detection (basic)
(function () {
    let devtools = false;
    const threshold = 160;

    setInterval(() => {
        if (
            window.outerWidth - window.innerWidth > threshold ||
            window.outerHeight - window.innerHeight > threshold
        ) {
            if (!devtools) {
                devtools = true;
                document.body.innerHTML = '';
            }
        } else {
            devtools = false;
        }
    }, 500);
})();
        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = text;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 2200);
        }
    </script>
